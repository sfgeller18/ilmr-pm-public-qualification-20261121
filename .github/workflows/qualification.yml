    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: grep -Fx 'Synthetic review qualification.' qualification.txt
